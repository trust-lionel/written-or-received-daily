[build]
  command = "npm run build"
  publish = "dist"

# Redirect www to apex domain — prevents duplicate content penalty
[[redirects]]
  from = "https://www.wordcards.co/*"
  to = "https://wordcards.co/:splat"
  status = 301
  force = true

# Redirect HTTP to HTTPS (Netlify handles this automatically but explicit is safer)
[[redirects]]
  from = "http://wordcards.co/*"
  to = "https://wordcards.co/:splat"
  status = 301
  force = true

# Security & performance headers applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Long cache for static assets (Astro fingerprints filenames so this is safe)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML pages so new postcards surface quickly
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap — ensure crawlers always get fresh version
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml"

# robots.txt — always fresh
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
